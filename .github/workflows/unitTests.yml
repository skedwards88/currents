name: Unit tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Install requirements
        run: npm ci

      - name: Test
        run: npm t
